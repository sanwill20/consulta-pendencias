<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário - Grupo Asa Norte</title>
<style>
  :root {
    --primary: #333F4F;
    --light: #D9D9D9;
    --white: #FFFFFF;
  }
  
  body { 
    margin: 0; 
    padding: 0; 
    font-family: Arial, sans-serif; 
    background: var(--light); 
    overflow: hidden;
  }
  
  .topbar { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    background: var(--primary); 
    padding: 10px 14px; 
    height: 35px;
  }
  
  .title { 
    color: var(--white); 
    font-size: 16px; 
    font-weight: bold; 
  }
  
  .btn-voltar { 
    color: var(--white); 
    border: 1px solid var(--white); 
    padding: 5px 10px; 
    border-radius: 4px; 
    text-decoration: none; 
    font-size: 12px; 
    font-weight: bold; 
  }
  
  .btn-voltar:hover {
    background: rgba(255,255,255,0.2);
  }

  iframe { 
    width: 100%; 
    height: calc(100vh - 55px); 
    border: none; 
    display: block;
    background: #fff;
  }
</style>
</head>
<body>

  <div class="topbar">
    <span class="title">Pesquisa / Formulário</span>
    <a href="index.html" class="btn-voltar">🏠 Menu Principal</a>
  </div>

  <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdiNHDKlhiztOIDP-WVC6yAlhYsE1dl-NlZZprZQwiZ06oWlA/viewform?embedded=true">Carregando formulário...</iframe>

</body>
</html>
