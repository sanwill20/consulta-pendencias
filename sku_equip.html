<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKU - Equipamentos</title>

<style>
:root{
  --primary:#333F4F;
  --secondary:#44546A;
  --light:#D9D9D9;
  --black:#000000;
  --white:#FFFFFF;
}

body{
  font-family:Arial, sans-serif;
  margin:15px;
  background:var(--light);
  color:var(--black);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--primary);
  padding:10px 14px;
  border-radius:6px;
  margin-bottom:12px;
}

.topbar .title{
  color:var(--white);
  font-size:18px;
  font-weight:bold;
}

.btn-voltar{
  background:transparent;
  color:var(--white);
  border:1px solid var(--white);
  padding:6px 12px;
  border-radius:4px;
  cursor:pointer;
  font-size:13px;
  font-weight:bold;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.btn-voltar:hover{
  background:rgba(255,255,255,0.15);
}

label{
  font-weight:bold;
  margin-top:6px;
  display:block;
  color:var(--primary);
}

select, input{
  padding:8px;
  margin-top:2px;
  min-width:180px;
  border:1px solid var(--secondary);
  border-radius:4px;
  background:var(--white);
  box-sizing: border-box;
}

/* Remove setas do input number */
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { 
  -webkit-appearance: none; 
  margin: 0; 
}
input[type=number] { -moz-appearance: textfield; }

button{
  padding:8px 16px;
  margin-top:10px;
  cursor:pointer;
  background:var(--secondary);
  color:var(--white);
  border:none;
  border-radius:4px;
  font-weight:bold;
  transition:.2s;
}

button:hover{
  background:var(--primary);
}

.btn-pdf{
  background:#d32f2f;
  color:white;
}

.btn-pdf:hover{
  background:#b71c1c;
}

.table-container{
  width:100%;
  overflow-x:auto;
}

table{
  border-collapse:collapse;
  margin-top:12px;
  font-size:13px;
  width:100%;
  background:var(--white);
  white-space:nowrap;
}

th, td{
  border:1px solid var(--light);
  padding:6px 8px;
  text-align:left;
}

th{
  background:var(--primary);
  color:var(--white);
}

tr:nth-child(even){
  background:#f7f7f7;
}

.message{
  margin-top:8px;
  font-weight:bold;
}

.success{color:green}
.warning{color:#b45309}
.error{color:red}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:flex-end;
  background:var(--white);
  padding:12px;
  border-radius:6px;
  border:1px solid var(--light);
}

.filter{
  display:flex;
  flex-direction:column;
  flex: 1;
}

.btn-group {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

/* CARDS MOBILE (Oculto no Desktop por padrão) */
#mobile-cards {
  display: none;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}

.card-item {
  background: var(--white);
  border-radius: 6px;
  padding: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  border-left: 5px solid var(--secondary);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
  font-size: 14px;
  color: var(--primary);
  margin-bottom: 6px;
}

.card-title {
  font-size: 15px;
  font-weight: bold;
  color: #000;
  margin-bottom: 8px;
}

.sku-badge {
  background: #e2e8f0;
  color: #334155;
  font-size: 11px;
  padding: 3px 6px;
  border-radius: 4px;
  margin-right: 4px;
  margin-bottom: 4px;
  display: inline-block;
}

/* RESPONSIVIDADE (MOBILE) */
@media (max-width: 768px){
  .btn-pdf{ display:none !important; }
  .table-container { display: none; } /* Oculta a tabela pesada no celular */
  #mobile-cards { display: flex; } /* Exibe os Cards leves no celular */
  
  .filter { min-width: 100%; }
  select, input { width: 100%; }
  .btn-group { width: 100%; }
  .btn-group button { flex: 1; }
}
</style>
</head>
<body>
  
  <div class="topbar">
    <span class="title">SKU - Equipamentos</span>
    <a href="index.html" class="btn-voltar no-pdf">🏠 Menu Principal</a>
  </div>
        
  <div class="filters no-pdf">
    <div class="filter">
      <label>🏢 Operação</label>
      <select id="operacao">
        <option value="">Todas</option>
        <option>Asa Norte Bom Jesus</option>
        <option>Asa Norte Campo Maior</option>
        <option>Asa Norte Parnaiba</option>
        <option>Asa Norte São Raimundo</option>
        <option>Asa Norte Teresina</option>
      </select>
    </div>

     <div class="filter">
      <label>🙋🏻‍♂️ RN</label>
      <input type="number" id="rn" placeholder="Digite apenas números..." pattern="[0-9]*" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
    </div>
      
    <div class="filter">
      <label>👤 Cliente / PDV</label>
      <input type="number" id="cliente" placeholder="Digite o PDV..." pattern="[0-9]*" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
    </div>

    <div class="btn-group no-pdf">
      <button onclick="buscar()">🔍 Buscar</button>
      <button onclick="limpar()">🧹 Limpar</button>
      <button class="btn-pdf" onclick="exportarPDF()">📄 PDF</button>
    </div>
  </div>
  
  <div id="area-pdf">    
    <div class="message no-pdf" id="mensagem"></div>
    
    <!-- Visualização Desktop (Tabela) -->
    <div class="table-container">
      <div id="tabela"></div>
    </div>

    <!-- Visualização Mobile (Cards) -->
    <div id="mobile-cards"></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
const SUPABASE_URL = "https://nzpquivtrvqwtsiooodr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56cHF1aXZ0cnZxd3RzaW9vb2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MTc2MDYsImV4cCI6MjA4MzI5MzYwNn0.xkoPm1W0-IFDYCoVgq2PFhXJ9Bg8oP9j9Eht7yIJzcM";

const operacao = document.getElementById("operacao"),
      rn = document.getElementById("rn"),
      cliente = document.getElementById("cliente"),
      mensagem = document.getElementById("mensagem"),
      tabela = document.getElementById("tabela"),
      cardsContainer = document.getElementById("mobile-cards");

async function buscar(){
  const params = [];

  if(operacao.value) params.push(`Operacao=eq.${encodeURIComponent(operacao.value)}`);
  if(rn.value) params.push(`Cod_Setor=eq.${encodeURIComponent(rn.value)}`);
  if(cliente.value) params.push(`PDV=ilike.*${encodeURIComponent(cliente.value)}*`);

  const colunas = "PDV,Nome_Fantasia,Qtde_SKU,SKU_01,SKU_02,SKU_03,SKU_04,SKU_05,SKU_06,SKU_07,SKU_08,SKU_09,SKU_10";
  const url = `${SUPABASE_URL}/rest/v1/sku_equip?select=${colunas}${params.length ? '&' + params.join("&") : ''}`;

  mensagem.textContent = "Carregando...";
  mensagem.className = "message";
  tabela.innerHTML = "";
  cardsContainer.innerHTML = "";

  try{
    const r = await fetch(url, {
      headers:{
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    });

    const d = await r.json();

    if(!Array.isArray(d) || !d.length){
      mensagem.textContent = "Nenhum registro encontrado.";
      mensagem.className = "message warning";
      return;
    }

    mensagem.textContent = `${d.length} registro(s) encontrado(s).`;
    mensagem.className = "message success";

    // --- MONTA A TABELA (DESKTOP / PDF) ---
    let h = `<table>
      <thead>
        <tr>
          <th>PDV</th>
          <th>Fantasia</th>
          <th>Qtde SKU</th>
          <th>SKU 01</th>
          <th>SKU 02</th>
          <th>SKU 03</th>
          <th>SKU 04</th>
          <th>SKU 05</th>
          <th>SKU 06</th>
          <th>SKU 07</th>
          <th>SKU 08</th>
          <th>SKU 09</th>
          <th>SKU 10</th>
        </tr>
      </thead>
      <tbody>`;

    // --- MONTA OS CARDS (MOBILE) ---
    let cardsHtml = "";

    d.forEach(r => {
      // Linha Tabela
      h += `<tr>
        <td>${r.PDV || ""}</td>
        <td>${r.Nome_Fantasia || ""}</td>
        <td>${r.Qtde_SKU ?? ""}</td>
        <td>${r.SKU_01 || ""}</td>
        <td>${r.SKU_02 || ""}</td>
        <td>${r.SKU_03 || ""}</td>
        <td>${r.SKU_04 || ""}</td>
        <td>${r.SKU_05 || ""}</td>
        <td>${r.SKU_06 || ""}</td>
        <td>${r.SKU_07 || ""}</td>
        <td>${r.SKU_08 || ""}</td>
        <td>${r.SKU_09 || ""}</td>
        <td>${r.SKU_10 || ""}</td>
      </tr>`;

      // Monta lista de SKUs não vazios para o Card
      let skusList = "";
      for(let i=1; i<=10; i++){
        const key = `SKU_${i < 10 ? '0' + i : i}`;
        if(r[key]){
          skusList += `<span class="sku-badge">${r[key]}</span>`;
        }
      }

      // Card HTML
      cardsHtml += `
        <div class="card-item">
          <div class="card-header">
            <span>📍 PDV: ${r.PDV || "N/A"}</span>
            <span>📦 Qtd: ${r.Qtde_SKU ?? 0}</span>
          </div>
          <div class="card-title">${r.Nome_Fantasia || "Sem Nome Fantasia"}</div>
          <div>${skusList || "<small>Nenhum SKU associado</small>"}</div>
        </div>
      `;
    });

    tabela.innerHTML = h + "</tbody></table>";
    cardsContainer.innerHTML = cardsHtml;

  }catch(e){
    console.error(e);
    mensagem.textContent = "Erro ao consultar os dados.";
    mensagem.className = "message error";
  }
}

function limpar(){
  document.querySelectorAll("input,select").forEach(e => e.value = "");
  tabela.innerHTML = "";
  cardsContainer.innerHTML = "";
  mensagem.textContent = "";
}

function exportarPDF(){
  const area = document.getElementById("area-pdf");

  html2pdf().set({
    margin: 8,
    filename: 'SKU_Equipamentos.pdf',
    html2canvas: { scale: 2 },
    jsPDF: { orientation: 'landscape' },
    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
    ignoreElements: el => el.classList.contains("no-pdf")
  }).from(area).save();
}
</script>

</body>
</html>
