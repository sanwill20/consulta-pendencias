<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKU - Equipamentos</title>

<style>
:root{
  --primary:#333F4F;
  --secondary:#44546A;
  --light:#D9D9D9;
  --black:#000000;
  --white:#FFFFFF;
}

body{
  font-family:Arial, sans-serif;
  margin:20px;
  background:var(--light);
  color:var(--black);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--primary);
  padding:10px 14px;
  border-radius:6px;
  margin-bottom:12px;
}

.topbar .title{
  color:var(--white);
  font-size:18px;
  font-weight:bold;
}

.btn-voltar{
  background:transparent;
  color:var(--white);
  border:1px solid var(--white);
  padding:6px 12px;
  border-radius:4px;
  cursor:pointer;
  font-size:13px;
  font-weight:bold;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:0;
}

.btn-voltar:hover{
  background:rgba(255,255,255,0.15);
}

label{
  font-weight:bold;
  margin-top:6px;
  display:block;
  color:var(--primary);
}

select, input{
  padding:6px;
  margin-top:2px;
  min-width:200px;
  border:1px solid var(--secondary);
  border-radius:4px;
  background:var(--white);
}

button{
  padding:8px 16px;
  margin-top:10px;
  cursor:pointer;
  background:var(--secondary);
  color:var(--white);
  border:none;
  border-radius:4px;
  transition:.2s;
}

button:hover{
  background:var(--primary);
}

.btn-pdf{
  background:#d32f2f;
  color:white;
  font-weight:bold;
}

.btn-pdf:hover{
  background:#b71c1c;
}

/* Permite rolagem horizontal em telas menores */
.table-container{
  width:100%;
  overflow-x:auto;
}

table{
  border-collapse:collapse;
  margin-top:12px;
  font-size:13px;
  width:100%;
  background:var(--white);
  white-space:nowrap; /* Mantém os dados alinhados ao rolar */
}

th, td{
  border:1px solid var(--light);
  padding:6px 8px;
  text-align:left;
}

th{
  background:var(--primary);
  color:var(--white);
}

tr:nth-child(even){
  background:#f7f7f7;
}

.message{
  margin-top:8px;
  font-weight:bold;
}

.success{color:green}
.warning{color:#b45309}
.error{color:red}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:flex-end;
  background:var(--white);
  padding:12px;
  border-radius:6px;
  border:1px solid var(--light);
}

.filter{
  display:flex;
  flex-direction:column;
}

.desktop-only{
  display:inline-block;
}

@media (max-width: 768px){
  .btn-pdf{
    display:none !important;
  }
}
</style>
</head>
<body>
  
  <div class="topbar">
    <span class="title">SKU - Equipamentos</span>
    <a href="index.html" class="btn-voltar no-pdf">🏠 Menu Principal</a>
  </div>
        
  <div class="filters no-pdf">
    <div class="filter">
      <label>🏢 Operação</label>
      <select id="operacao">
        <option value="">Todas</option>
        <option>Asa Norte Bom Jesus</option>
        <option>Asa Norte Campo Maior</option>
        <option>Asa Norte Parnaiba</option>
        <option>Asa Norte São Raimundo</option>
        <option>Asa Norte Teresina</option>
      </select>
    </div>

     <div class="filter">
      <label>🙋🏻‍♂️ RN</label>
      <input id="rn" placeholder="Digite o seu setor. Ex: 111">
    </div>
      
    <div class="filter">
      <label>👤 Cliente / PDV</label>
      <input id="cliente" placeholder="Digite o PDV (ex: 12345)">
    </div>
    
    <button class="btn-pdf" onclick="exportarPDF()">📄 Exportar p/ PDF</button>
  </div>
  
  <button class="no-pdf desktop-only" onclick="buscar()">🔍 Buscar</button>
  <button class="no-pdf desktop-only" onclick="limpar()">🧹 Limpar filtros</button>
  
  <div id="area-pdf">    
    <div class="message no-pdf" id="mensagem"></div>
    <div class="table-container">
      <div id="tabela"></div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
const SUPABASE_URL = "https://nzpquivtrvqwtsiooodr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56cHF1aXZ0cnZxd3RzaW9vb2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MTc2MDYsImV4cCI6MjA4MzI5MzYwNn0.xkoPm1W0-IFDYCoVgq2PFhXJ9Bg8oP9j9Eht7yIJzcM";

const operacao = document.getElementById("operacao"),
      rn = document.getElementById("rn"),
      cliente = document.getElementById("cliente"),
      sku = document.getElementById("sku"),
      mensagem = document.getElementById("mensagem"),
      tabela = document.getElementById("tabela");

async function buscar(){
  const params = [];

  if(operacao.value) params.push(`Operacao=eq.${encodeURIComponent(operacao.value)}`);
  if(rn.value) params.push(`Cod_Setor=eq.${encodeURIComponent(rn.value)}`);
  if(cliente.value) params.push(`PDV=ilike.*${encodeURIComponent(cliente.value)}*`);

  // Filtra por termo dentro de qualquer uma das colunas SKU_01 até SKU_10
  if(sku.value){
    const skuTermo = encodeURIComponent(sku.value);
    const orCond = [];
    for(let i=1; i<=10; i++){
      const num = String(i).padStart(2, '0');
      orCond.push(`SKU_${num}.ilike.*${skuTermo}*`);
    }
    params.push(`or=(${orCond.join(",")})`);
  }

  const colunas = "PDV,Nome_Fantasia,Cod_Setor,Operacao,Qtde_SKU,SKU_01,SKU_02,SKU_03,SKU_04,SKU_05,SKU_06,SKU_07,SKU_08,SKU_09,SKU_10";
  const url = `${SUPABASE_URL}/rest/v1/sku_equip?select=${colunas}${params.length ? '&' + params.join("&") : ''}`;

  mensagem.textContent = "Carregando...";
  mensagem.className = "message";
  tabela.innerHTML = "";

  try{
    const r = await fetch(url, {
      headers:{
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    });

    const d = await r.json();

    if(!Array.isArray(d) || !d.length){
      mensagem.textContent = "Nenhum registro encontrado.";
      mensagem.className = "message warning";
      return;
    }

    mensagem.textContent = `${d.length} registro(s) encontrado(s).`;
    mensagem.className = "message success";

    let h = `<table>
      <thead>
        <tr>
          <th>PDV</th>
          <th>Fantasia</th>
          <th>Setor</th>
          <th>Operação</th>
          <th>Qtde SKU</th>
          <th>SKU 01</th>
          <th>SKU 02</th>
          <th>SKU 03</th>
          <th>SKU 04</th>
          <th>SKU 05</th>
          <th>SKU 06</th>
          <th>SKU 07</th>
          <th>SKU 08</th>
          <th>SKU 09</th>
          <th>SKU 10</th>
        </tr>
      </thead>
      <tbody>`;

    d.forEach(r => {
      h += `<tr>
        <td>${r.PDV || ""}</td>
        <td>${r.Nome_Fantasia || ""}</td>
        <td>${r.Cod_Setor || ""}</td>
        <td>${r.Operacao || ""}</td>
        <td>${r.Qtde_SKU ?? ""}</td>
        <td>${r.SKU_01 || ""}</td>
        <td>${r.SKU_02 || ""}</td>
        <td>${r.SKU_03 || ""}</td>
        <td>${r.SKU_04 || ""}</td>
        <td>${r.SKU_05 || ""}</td>
        <td>${r.SKU_06 || ""}</td>
        <td>${r.SKU_07 || ""}</td>
        <td>${r.SKU_08 || ""}</td>
        <td>${r.SKU_09 || ""}</td>
        <td>${r.SKU_10 || ""}</td>
      </tr>`;
    });

    tabela.innerHTML = h + "</tbody></table>";

  }catch(e){
    console.error(e);
    mensagem.textContent = "Erro ao consultar os dados.";
    mensagem.className = "message error";
  }
}

function limpar(){
  document.querySelectorAll("input,select").forEach(e => e.value = "");
  tabela.innerHTML = "";
  mensagem.textContent = "";
}

function exportarPDF(){
  const area = document.getElementById("area-pdf");

  html2pdf().set({
    margin: 8,
    filename: 'SKU_Equipamentos.pdf',
    html2canvas: { scale: 2 },
    jsPDF: { orientation: 'landscape' },
    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
    ignoreElements: el => el.classList.contains("no-pdf")
  }).from(area).save();
}
</script>

</body>
</html>
